<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DeskMate Design QA</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; padding: 28px; background: #e9eef4; color: #26313d; font-family: Arial, "Microsoft YaHei", sans-serif; }
      h1 { margin: 0 0 20px; font-size: 22px; }
      main { display: grid; grid-template-columns: 1fr 1fr; gap: 22px; }
      figure { margin: 0; padding: 14px; border: 1px solid #d2dbe5; border-radius: 18px; background: #fff; box-shadow: 0 14px 30px rgba(35,50,72,.08); }
      figcaption { margin: 0 0 10px; color: #667587; font-size: 13px; font-weight: 700; }
      img { display: block; width: 100%; border-radius: 10px; }
    </style>
  </head>
  <body>
    <h1>DeskMate 工作台：设计目标与可运行实现</h1>
    <main>
      <figure>
        <figcaption>设计目标 · Figma 视觉稿</figcaption>
        <img src="public/assets/qa-source-home.png" alt="Figma 视觉目标" />
      </figure>
      <figure>
        <figcaption>可运行实现 · React Demo</figcaption>
        <img src="public/assets/qa-implementation-home.png" alt="React Demo 实现" />
      </figure>
    </main>
  </body>
</html>
